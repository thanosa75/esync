name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `make dist` stamps the version from `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile static binary
        run: make dist PLATFORMS="${{ matrix.goos }}/${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: esync-${{ matrix.target }}
          path: |
            dist/esync-*-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/SHA256SUMS
          if-no-files-found: error
